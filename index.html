<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Manager</title>
	<link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <div id="root"></div>

    <script type="text/babel">
        // ==================== STORAGE UTILITIES ====================
        const STORAGE_KEYS = {
          ROSTER: 'class_roster_v3',
          ATTENDANCE_DATA: 'attendance_data_', 
          ATTENDANCE_META: 'attendance_meta', 
          ASSIGNMENTS_LIST: 'assignments_list_v1',
          ASSIGNMENT_DATA: 'assignment_data_',
        };

        const getFromStorage = (key, defaultValue) => {
          try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : defaultValue;
          } catch (e) {
            return defaultValue;
          }
        };

        const saveToStorage = (key, value) => {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {}
        };

        const getTodayString = () => new Date().toISOString().split('T')[0];

        // ==================== MASTER ROSTER COMPONENT ====================
        function MasterRoster() {
          const [roster, setRoster] = React.useState([]);
          const [columns, setColumns] = React.useState(['Roll No', 'Name', 'Phone']);
          const [newColumnName, setNewColumnName] = React.useState('');
          const [showAddColumn, setShowAddColumn] = React.useState(false);

          React.useEffect(() => {
            const saved = getFromStorage(STORAGE_KEYS.ROSTER, { roster: [], columns: ['Roll No', 'Name', 'Phone'] });
            setRoster(saved.roster || []);
            setColumns(saved.columns || ['Roll No', 'Name', 'Phone']);
          }, []);

          React.useEffect(() => {
            saveToStorage(STORAGE_KEYS.ROSTER, { roster, columns });
          }, [roster, columns]);

          const addStudent = () => {
            const newStudent = {};
            columns.forEach(col => newStudent[col] = '');
            setRoster([...roster, newStudent]);
          };

          const updateCell = (rowIdx, colKey, value) => {
            const updated = [...roster];
            updated[rowIdx][colKey] = value;
            setRoster(updated);
          };

          const deleteStudent = (rowIdx) => setRoster(roster.filter((_, i) => i !== rowIdx));

          const addColumn = () => {
            if (newColumnName.trim() && !columns.includes(newColumnName)) {
              setColumns([...columns, newColumnName]);
              roster.forEach(student => student[newColumnName] = '');
              setNewColumnName('');
              setShowAddColumn(false);
            }
          };

          const deleteColumn = (colName) => {
            if (colName === 'Roll No') return alert('Cannot delete Roll No');
            setColumns(columns.filter(c => c !== colName));
            const updated = roster.map(student => {
              const newStudent = { ...student };
              delete newStudent[colName];
              return newStudent;
            });
            setRoster(updated);
          };

          return (
            <div className="w-full h-full flex flex-col p-4 md:p-8 overflow-auto">
              <div className="mb-6">
                <h1 className="text-3xl font-bold text-gray-800 drop-shadow-sm">Master Roster</h1>
                <p className="text-gray-600">Manage your class database</p>
              </div>

              <div className="bg-white/40 backdrop-blur-xl border border-white/50 rounded-3xl shadow-xl overflow-hidden mb-6">
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse text-sm">
                    <thead>
                      <tr className="bg-white/30 border-b border-white/40">
                        {columns.map(col => (
                          <th key={col} className="px-6 py-4 text-left font-semibold text-gray-800 whitespace-nowrap">
                            <div className="flex items-center justify-between gap-4">
                              <span>{col}</span>
                              {col !== 'Roll No' && (
                                <button onClick={() => deleteColumn(col)} className="text-gray-500 hover:text-red-500 transition">❌</button>
                              )}
                            </div>
                          </th>
                        ))}
                        <th className="px-6 py-4 text-center font-semibold text-gray-800">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {roster.map((student, rowIdx) => (
                        <tr key={rowIdx} className="border-b border-white/20 hover:bg-white/20 transition duration-200">
                          {columns.map(col => (
                            <td key={col} className="px-6 py-3">
                              <input
                                type="text"
                                value={student[col] || ''}
                                onChange={(e) => updateCell(rowIdx, col, e.target.value)}
                                className="w-full px-3 py-2 bg-white/50 border border-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400/50 focus:bg-white transition text-gray-800 placeholder-gray-400"
                                placeholder={`Enter ${col}`}
                              />
                            </td>
                          ))}
                          <td className="px-6 py-3 text-center">
                            <button onClick={() => deleteStudent(rowIdx)} className="text-red-400 hover:text-red-600 transition p-2 bg-white/50 rounded-xl hover:bg-white">🗑️</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="flex flex-wrap gap-4">
                <button onClick={addStudent} className="flex items-center gap-2 px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl shadow-lg transition transform hover:scale-105 font-medium">
                  ➕ Add Student
                </button>
                {!showAddColumn ? (
                  <button onClick={() => setShowAddColumn(true)} className="flex items-center gap-2 px-6 py-3 bg-white/50 backdrop-blur-md border border-white/50 text-gray-800 rounded-2xl hover:bg-white/70 shadow-sm transition font-medium">
                    ➕ Add Column
                  </button>
                ) : (
                  <div className="flex gap-2 bg-white/40 backdrop-blur-md p-2 rounded-2xl border border-white/50 shadow-sm">
                    <input type="text" placeholder="Column Name" value={newColumnName} onChange={(e) => setNewColumnName(e.target.value)} className="px-4 py-2 bg-white/60 border border-transparent rounded-xl focus:outline-none focus:bg-white" autoFocus />
                    <button onClick={addColumn} className="px-4 py-2 bg-green-500 text-white rounded-xl shadow font-medium">Add</button>
                    <button onClick={() => setShowAddColumn(false)} className="px-4 py-2 bg-gray-400 text-white rounded-xl font-medium">Cancel</button>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // ==================== DAILY ATTENDANCE COMPONENT ====================
        function DailyAttendance() {
          const [selectedDate, setSelectedDate] = React.useState(getTodayString());
          const [hours, setHours] = React.useState(6);
          const [trackingData, setTrackingData] = React.useState({});
          const [currentRoster, setCurrentRoster] = React.useState([]);

          React.useEffect(() => {
            setCurrentRoster(getFromStorage(STORAGE_KEYS.ROSTER, { roster: [] }).roster || []);
            setTrackingData(getFromStorage(STORAGE_KEYS.ATTENDANCE_DATA + selectedDate, {}));
            
            const meta = getFromStorage(STORAGE_KEYS.ATTENDANCE_META, {});
            if (meta[selectedDate]) setHours(meta[selectedDate]);
          }, [selectedDate]);

          const saveTracking = (newData) => {
            setTrackingData(newData);
            saveToStorage(STORAGE_KEYS.ATTENDANCE_DATA + selectedDate, newData);
            
            const meta = getFromStorage(STORAGE_KEYS.ATTENDANCE_META, {});
            meta[selectedDate] = parseInt(hours);
            saveToStorage(STORAGE_KEYS.ATTENDANCE_META, meta);
          };

          const handleToggle = (rollNo, colIndex) => {
            const key = `${rollNo}_col${colIndex}`;
            saveTracking({ ...trackingData, [key]: !trackingData[key] });
          };

          const handleHoursChange = (e) => {
            const val = parseInt(e.target.value) || 1;
            setHours(val);
            const meta = getFromStorage(STORAGE_KEYS.ATTENDANCE_META, {});
            meta[selectedDate] = val;
            saveToStorage(STORAGE_KEYS.ATTENDANCE_META, meta);
          };

          const getRollNos = () => currentRoster.map(s => s['Roll No']).filter(Boolean);
          const cols = Array.from({ length: hours }, (_, i) => i + 1);

          const exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("Daily Attendance Register", 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text(`Date: ${selectedDate} | Tracked Hours: ${hours}`, 14, 30);

            const tableData = [];
            getRollNos().forEach(rollNo => {
              let absentCount = 0;
              cols.forEach(col => {
                if (!trackingData[`${rollNo}_col${col}`]) absentCount++;
              });
              tableData.push([rollNo, absentCount]);
            });

            doc.autoTable({
              startY: 35,
              head: [['Roll No', 'Total Absent Hours']],
              body: tableData,
              theme: 'grid',
              headStyles: { fillColor: [59, 130, 246] }
            });
            
            doc.save(`Attendance_${selectedDate}.pdf`);
          };

          return (
            <div className="w-full h-full flex flex-col p-4 md:p-8 overflow-auto">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
                <div>
                  <h1 className="text-3xl font-bold text-gray-800 drop-shadow-sm">Daily Register</h1>
                  <div className="flex items-center gap-4 mt-3 bg-white/50 p-2 rounded-xl border border-white/60 shadow-sm w-fit">
                    <div>
                      <label className="text-xs text-gray-500 block ml-2">Select Date</label>
                      <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="bg-transparent font-medium text-gray-800 focus:outline-none px-2" />
                    </div>
                    <div className="w-px h-8 bg-gray-300"></div>
                    <div>
                      <label className="text-xs text-gray-500 block ml-2">Hours Tracked</label>
                      <input type="number" min="1" max="15" value={hours} onChange={handleHoursChange} className="bg-transparent font-medium text-gray-800 focus:outline-none px-2 w-16" />
                    </div>
                  </div>
                </div>
                <button onClick={exportToPDF} className="flex items-center justify-center gap-2 px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-2xl shadow-lg transition transform hover:scale-105 font-medium">
                  📄 Download Daily PDF
                </button>
              </div>

              <div className="bg-white/40 backdrop-blur-xl border border-white/50 rounded-3xl shadow-xl overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse">
                    <thead>
                      <tr className="bg-white/30 border-b border-white/40">
                        <th className="px-6 py-4 text-left font-semibold text-gray-800 sticky left-0 bg-white/40 backdrop-blur-md z-10">Roll No</th>
                        {cols.map(col => (
                          <th key={col} className="px-4 py-4 text-center font-semibold text-gray-800 min-w-[80px]">Hour {col}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {getRollNos().length === 0 ? (
                        <tr><td colSpan={cols.length + 1} className="px-6 py-8 text-center text-gray-500">No students found. Add them in Master Roster.</td></tr>
                      ) : (
                        getRollNos().map((rollNo, idx) => (
                          <tr key={idx} className="border-b border-white/20 hover:bg-white/20 transition duration-200">
                            <td className="px-6 py-4 font-medium text-gray-800 sticky left-0 bg-white/40 backdrop-blur-md z-10">{rollNo}</td>
                            {cols.map(col => {
                              const isChecked = trackingData[`${rollNo}_col${col}`] || false;
                              return (
                                <td key={col} className="px-4 py-3 text-center">
                                  <button onClick={() => handleToggle(rollNo, col)} className={`mx-auto flex items-center justify-center p-2 rounded-2xl transition transform hover:scale-110 shadow-sm ${isChecked ? 'bg-green-100/80 border border-green-200' : 'bg-white/50 border border-white/80'}`}>
                                    {isChecked ? <span className="text-lg">✅</span> : <span className="text-lg opacity-30">⭕</span>}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        }

        // ==================== ASSIGNMENT TRACKER COMPONENT ====================
        function AssignmentTracker({ assignmentId, assignmentData }) {
          const [trackingData, setTrackingData] = React.useState({});
          const [currentRoster, setCurrentRoster] = React.useState([]);

          React.useEffect(() => {
            setTrackingData(getFromStorage(STORAGE_KEYS.ASSIGNMENT_DATA + assignmentId, {}));
            setCurrentRoster(getFromStorage(STORAGE_KEYS.ROSTER, { roster: [] }).roster || []);
          }, [assignmentId]);

          const saveTracking = (newData) => {
            setTrackingData(newData);
            saveToStorage(STORAGE_KEYS.ASSIGNMENT_DATA + assignmentId, newData);
          };

          const handleToggle = (rollNo) => {
            saveTracking({ ...trackingData, [rollNo]: !trackingData[rollNo] });
          };

          const getRollNos = () => currentRoster.map(s => s['Roll No']).filter(Boolean);

          const exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text(`Assignment: ${assignmentData.name}`, 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text(`Due Date: ${assignmentData.date}`, 14, 30);

            const tableData = [];
            getRollNos().forEach(rollNo => {
              const isSubmitted = trackingData[rollNo] ? "Yes" : "No";
              tableData.push([rollNo, isSubmitted]);
            });

            doc.autoTable({
              startY: 35,
              head: [['Roll No', 'Submitted (Yes/No)']],
              body: tableData,
              theme: 'grid',
              headStyles: { fillColor: [139, 92, 246] }
            });
            
            doc.save(`${assignmentData.name.replace(/\s+/g, '_')}_Report.pdf`);
          };

          return (
            <div className="w-full h-full flex flex-col p-4 md:p-8 overflow-auto">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
                <div>
                  <h1 className="text-3xl font-bold text-gray-800 drop-shadow-sm">{assignmentData.name}</h1>
                  <p className="text-gray-600 mt-1">Due Date: {assignmentData.date} | Assignment Tracking</p>
                </div>
                <button onClick={exportToPDF} className="flex items-center justify-center gap-2 px-6 py-3 bg-purple-500 hover:bg-purple-600 text-white rounded-2xl shadow-lg transition transform hover:scale-105 font-medium">
                  📄 Download Assignment PDF
                </button>
              </div>

              <div className="bg-white/40 backdrop-blur-xl border border-white/50 rounded-3xl shadow-xl overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse">
                    <thead>
                      <tr className="bg-white/30 border-b border-white/40">
                        <th className="px-6 py-4 text-left font-semibold text-gray-800 sticky left-0 bg-white/40 backdrop-blur-md z-10">Roll No</th>
                        <th className="px-6 py-4 text-center font-semibold text-gray-800">Submitted</th>
                      </tr>
                    </thead>
                    <tbody>
                      {getRollNos().length === 0 ? (
                        <tr><td colSpan="2" className="px-6 py-8 text-center text-gray-500">No students found.</td></tr>
                      ) : (
                        getRollNos().map((rollNo, idx) => (
                          <tr key={idx} className="border-b border-white/20 hover:bg-white/20 transition duration-200">
                            <td className="px-6 py-4 font-medium text-gray-800 sticky left-0 bg-white/40 backdrop-blur-md z-10">{rollNo}</td>
                            <td className="px-6 py-3 text-center">
                              <button onClick={() => handleToggle(rollNo)} className={`mx-auto flex items-center justify-center p-2 rounded-2xl transition transform hover:scale-110 shadow-sm ${trackingData[rollNo] ? 'bg-purple-100/80 border border-purple-300' : 'bg-white/50 border border-white/80'}`}>
                                {trackingData[rollNo] ? <span className="text-lg">✅</span> : <span className="text-lg opacity-30">❌</span>}
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        }

        // ==================== ANALYTICS & REPORTS COMPONENT ====================
        function AnalyticsReport() {
          const [startDate, setStartDate] = React.useState('');
          const [endDate, setEndDate] = React.useState('');
          const [reportData, setReportData] = React.useState([]);

          const generateReport = () => {
            if (!startDate || !endDate) return alert("Please select a From and To date.");
            
            const meta = getFromStorage(STORAGE_KEYS.ATTENDANCE_META, {});
            const datesToProcess = Object.keys(meta).filter(date => date >= startDate && date <= endDate);

            if (datesToProcess.length === 0) {
              setReportData([]);
              return alert("No attendance data found for this date range.");
            }

            const currentRoster = getFromStorage(STORAGE_KEYS.ROSTER, { roster: [] }).roster || [];
            const rollNos = currentRoster.map(s => s['Roll No']).filter(Boolean);

            let totalPossibleHours = 0;
            const studentStats = {};
            
            rollNos.forEach(rollNo => studentStats[rollNo] = { absent: 0, present: 0 });

            datesToProcess.forEach(date => {
              const hoursTracked = meta[date];
              totalPossibleHours += hoursTracked;
              const dailyData = getFromStorage(STORAGE_KEYS.ATTENDANCE_DATA + date, {});
              
              rollNos.forEach(rollNo => {
                for (let col = 1; col <= hoursTracked; col++) {
                  if (dailyData[`${rollNo}_col${col}`]) {
                    studentStats[rollNo].present += 1;
                  } else {
                    studentStats[rollNo].absent += 1;
                  }
                }
              });
            });

            const formattedData = rollNos.map(rollNo => ({
              rollNo,
              absent: studentStats[rollNo].absent,
              present: studentStats[rollNo].present,
              total: totalPossibleHours
            }));

            formattedData.sort((a, b) => b.absent - a.absent);
            setReportData(formattedData);
          };

          const exportStatementPDF = () => {
            if (reportData.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("Analytics Statement", 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text(`Reporting Period: ${startDate} to ${endDate}`, 14, 30);

            const tableData = reportData.map(row => [row.rollNo, row.total, row.present, row.absent]);

            doc.autoTable({
              startY: 35,
              head: [['Roll No', 'Total Tracked', 'Hours Present', 'Hours Absent']],
              body: tableData,
              theme: 'grid',
              headStyles: { fillColor: [59, 130, 246] }
            });
            
            doc.save(`Statement_${startDate}_to_${endDate}.pdf`);
          };

          return (
            <div className="w-full h-full flex flex-col p-4 md:p-8 overflow-auto">
              <h1 className="text-3xl font-bold text-gray-800 drop-shadow-sm mb-6">Reports & Analytics</h1>
              
              <div className="bg-white/60 backdrop-blur-md p-6 rounded-3xl border border-white/50 shadow-lg mb-6">
                <h2 className="text-lg font-semibold text-gray-700 mb-4">Generate Attendance Statement</h2>
                <div className="flex flex-wrap items-end gap-4">
                  <div>
                    <label className="block text-sm text-gray-600 mb-1">From Date</label>
                    <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="px-4 py-2 rounded-xl border border-gray-200" />
                  </div>
                  <div>
                    <label className="block text-sm text-gray-600 mb-1">To Date</label>
                    <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="px-4 py-2 rounded-xl border border-gray-200" />
                  </div>
                  <button onClick={generateReport} className="px-6 py-2 bg-blue-600 text-white rounded-xl shadow hover:bg-blue-700 transition">
                    Run Query
                  </button>
                </div>
              </div>

              {reportData.length > 0 && (
                <div className="bg-white/40 backdrop-blur-xl border border-white/50 rounded-3xl shadow-xl overflow-hidden">
                  <div className="p-4 border-b border-white/40 flex justify-between items-center bg-white/30">
                    <h3 className="font-semibold text-gray-800">Statement Results</h3>
                    <button onClick={exportStatementPDF} className="text-sm px-4 py-2 bg-red-500 text-white rounded-xl shadow hover:bg-red-600 font-medium">
                      📄 Download PDF Statement
                    </button>
                  </div>
                  <table className="w-full border-collapse">
                    <thead>
                      <tr className="bg-white/20 border-b border-white/40">
                        <th className="px-6 py-4 text-left font-semibold text-gray-800">Roll No</th>
                        <th className="px-6 py-4 text-center font-semibold text-gray-800">Total Tracked</th>
                        <th className="px-6 py-4 text-center font-semibold text-gray-800">Present Hours</th>
                        <th className="px-6 py-4 text-center font-semibold text-gray-800">Absent Hours</th>
                      </tr>
                    </thead>
                    <tbody>
                      {reportData.map((row, idx) => (
                        <tr key={idx} className="border-b border-white/20 hover:bg-white/20 transition">
                          <td className="px-6 py-4 font-medium text-gray-800">{row.rollNo}</td>
                          <td className="px-6 py-4 text-center text-gray-600">{row.total}</td>
                          <td className="px-6 py-4 text-center text-green-600 font-medium">{row.present}</td>
                          <td className="px-6 py-4 text-center text-red-500 font-bold">{row.absent}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          );
        }

        // ==================== CREATE ASSIGNMENT MODAL ====================
        function CreateAssignmentModal({ onClose, onCreate }) {
          const [name, setName] = React.useState('');
          const [date, setDate] = React.useState(getTodayString());

          const handleCreate = () => {
            if (name.trim() && date) {
              onCreate({ name, date });
              onClose();
            }
          };

          return (
            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white/80 backdrop-blur-xl border border-white/50 rounded-3xl max-w-md w-full p-8 shadow-2xl">
                <h2 className="text-2xl font-bold text-gray-800 mb-6">Create New Assignment</h2>
                
                <div className="space-y-5">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Assignment Name</label>
                    <input type="text" placeholder="e.g., Final Project Submission" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-4 py-3 bg-white/60 border border-white/80 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" autoFocus />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Due Date</label>
                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-4 py-3 bg-white/60 border border-white/80 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
                  </div>
                </div>

                <div className="flex gap-3 mt-8">
                  <button onClick={handleCreate} disabled={!name.trim()} className="flex-1 px-4 py-3 bg-purple-600 text-white rounded-2xl font-medium shadow-lg hover:bg-purple-700 disabled:opacity-50 transition">Create</button>
                  <button onClick={onClose} className="flex-1 px-4 py-3 bg-white/50 border border-gray-300 text-gray-700 rounded-2xl font-medium hover:bg-white/80 transition">Cancel</button>
                </div>
              </div>
            </div>
          );
        }

        // ==================== SIDEBAR & MAIN LAYOUT ====================
        function App() {
          const [activeView, setActiveView] = React.useState({ type: 'daily' });
          const [assignments, setAssignments] = React.useState([]);
          const [sidebarOpen, setSidebarOpen] = React.useState(false);
          const [showAssignmentModal, setShowAssignmentModal] = React.useState(false);

          React.useEffect(() => {
            setAssignments(getFromStorage(STORAGE_KEYS.ASSIGNMENTS_LIST, []));
          }, []);

          const saveAssignments = (list) => {
            setAssignments(list);
            saveToStorage(STORAGE_KEYS.ASSIGNMENTS_LIST, list);
          };

          const handleCreateAssignment = (data) => {
            const newAssig = { id: Date.now().toString(), ...data };
            saveAssignments([...assignments, newAssig]);
            setActiveView({ type: 'assignment', id: newAssig.id });
          };

          const handleDeleteAssignment = (id) => {
            if (confirm('Delete this assignment tracker?')) {
              saveAssignments(assignments.filter(a => a.id !== id));
              localStorage.removeItem(STORAGE_KEYS.ASSIGNMENT_DATA + id);
              if (activeView.id === id) setActiveView({ type: 'daily' });
            }
          };

          const currentAssignment = assignments.find(a => a.id === activeView.id);

          return (
            <div className="flex h-screen bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 font-sans antialiased selection:bg-blue-200">
              
              {sidebarOpen && <div className="fixed inset-0 bg-gray-900/20 backdrop-blur-sm md:hidden z-30" onClick={() => setSidebarOpen(false)} />}

              <div className={`fixed md:static top-0 left-0 h-screen w-72 bg-white/40 backdrop-blur-2xl border-r border-white/50 flex flex-col transform transition-transform duration-300 z-40 shadow-2xl ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                
                <div className="p-6 flex justify-between items-center border-b border-white/40">
                  <div>
                    <h1 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Class Hub</h1>
                    <p className="text-xs text-gray-500 font-medium tracking-wider uppercase mt-1">Workspace</p>
                  </div>
                  <button onClick={() => setSidebarOpen(false)} className="md:hidden text-gray-500 bg-white/50 p-2 rounded-full">❌</button>
                </div>

                <nav className="flex-1 overflow-y-auto p-4 space-y-6">
                  <div className="space-y-2">
                    <button onClick={() => { setActiveView({ type: 'daily' }); setSidebarOpen(false); }} className={`w-full text-left px-4 py-3 rounded-2xl font-semibold transition ${activeView.type === 'daily' ? 'bg-white/80 shadow-sm text-blue-600 border border-white' : 'text-gray-600 hover:bg-white/40'}`}>
                      📅 Daily Register
                    </button>
                    <button onClick={() => { setActiveView({ type: 'roster' }); setSidebarOpen(false); }} className={`w-full text-left px-4 py-3 rounded-2xl font-semibold transition ${activeView.type === 'roster' ? 'bg-white/80 shadow-sm text-blue-600 border border-white' : 'text-gray-600 hover:bg-white/40'}`}>
                      👥 Master Roster
                    </button>
                    <button onClick={() => { setActiveView({ type: 'analytics' }); setSidebarOpen(false); }} className={`w-full text-left px-4 py-3 rounded-2xl font-semibold transition ${activeView.type === 'analytics' ? 'bg-white/80 shadow-sm text-blue-600 border border-white' : 'text-gray-600 hover:bg-white/40'}`}>
                      📊 Analytics & Reports
                    </button>
                  </div>

                  <div>
                    <div className="flex items-center justify-between px-2 mb-3">
                      <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Assignments</h3>
                      <button onClick={() => setShowAssignmentModal(true)} className="p-1.5 bg-white/50 text-purple-500 rounded-lg shadow-sm hover:bg-white transition">➕</button>
                    </div>
                    
                    <div className="space-y-1">
                      {assignments.map(assig => (
                        <div key={assig.id} className="flex items-center group">
                          <button onClick={() => { setActiveView({ type: 'assignment', id: assig.id }); setSidebarOpen(false); }} className={`flex-1 text-left px-4 py-3 rounded-2xl font-medium transition text-sm ${activeView.id === assig.id ? 'bg-purple-100/50 shadow-sm text-purple-700 border border-purple-200' : 'text-gray-600 hover:bg-white/40'}`}>
                            {assig.name}
                          </button>
                          <button onClick={() => handleDeleteAssignment(assig.id)} className="p-2 text-gray-400 hover:text-red-500 transition opacity-0 group-hover:opacity-100">🗑️</button>
                        </div>
                      ))}
                      {assignments.length === 0 && <p className="text-xs text-gray-400 px-2 italic">No assignments created.</p>}
                    </div>
                  </div>
                </nav>
              </div>

              <div className="flex-1 flex flex-col min-w-0">
                <div className="md:hidden bg-white/40 backdrop-blur-xl border-b border-white/50 px-4 py-3 flex items-center justify-between shadow-sm z-20">
                  <button onClick={() => setSidebarOpen(true)} className="p-2 bg-white/50 rounded-xl text-gray-700 shadow-sm">☰</button>
                  <span className="font-bold text-gray-800">Class Hub</span>
                  <div className="w-8" />
                </div>

                <div className="flex-1 overflow-hidden">
                  {activeView.type === 'daily' && <DailyAttendance />}
                  {activeView.type === 'roster' && <MasterRoster />}
                  {activeView.type === 'analytics' && <AnalyticsReport />}
                  {activeView.type === 'assignment' && currentAssignment && <AssignmentTracker assignmentId={activeView.id} assignmentData={currentAssignment} />}
                </div>
              </div>

              {showAssignmentModal && <CreateAssignmentModal onClose={() => setShowAssignmentModal(false)} onCreate={handleCreateAssignment} />}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
